app = "notch-pb"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PB_PUBLIC_URL = "https://notch-pb.fly.dev"

[[mounts]]
  source = "pb_data"
  destination = "/pb/pb_data"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
